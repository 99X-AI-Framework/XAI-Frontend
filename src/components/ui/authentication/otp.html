<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - Standalone UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-card">
        <!-- Brand / Header -->
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1 class="auth-title">Verification code</h1>
            <p class="auth-subtitle">We sent a 6-digit verification code to</p>
            <div class="badge-email" id="displayEmailBadge">
                <span id="targetEmail">u***r@example.com</span>
            </div>
        </div>

        <div id="statusMessage" style="display: none; padding: 0.6rem 0.8rem; font-size: 0.8rem; margin-bottom: 0.85rem; border-radius: 8px;"></div>

        <!-- 6-Digit OTP Form -->
        <form id="otpForm" onsubmit="handleOtpSubmit(event)">
            <div class="otp-inputs">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" autofocus autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            </div>

            <button type="submit" id="verifyBtn" class="btn-submit">
                <span>Verify & Continue &rarr;</span>
            </button>
        </form>

        <!-- Resend Code Row -->
        <div style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">
            Didn't receive code? 
            <button type="button" id="resendBtn" onclick="handleResend()" style="background: none; border: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem; cursor: pointer; text-decoration: underline; padding: 0;">
                Resend code
            </button>
        </div>

        <!-- Back to login -->
        <div class="auth-footer" style="margin-top: 0.85rem;">
            <a href="login.html" style="color: var(--text-muted);">&larr; Back to login</a>
        </div>
    </div>

    <script>
        // Extract email parameter from query string if available
        const urlParams = new URLSearchParams(window.location.search);
        const rawEmail = urlParams.get('email');
        if (rawEmail) {
            const parts = rawEmail.split('@');
            if (parts.length === 2) {
                const u = parts[0];
                const masked = u.length > 2 ? u[0] + '***' + u[u.length - 1] : u[0] + '***';
                document.getElementById('targetEmail').textContent = `${masked}@${parts[1]}`;
            } else {
                document.getElementById('targetEmail').textContent = rawEmail;
            }
        }

        const inputs = document.querySelectorAll('.otp-box');
        const verifyBtn = document.getElementById('verifyBtn');
        const resendBtn = document.getElementById('resendBtn');
        const statusMsg = document.getElementById('statusMessage');

        // Manage focus jumps between input boxes
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/\D/g, '');
                input.value = val ? val[0] : '';
                if (val && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Paste 6-digit code
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
                if (pasteData) {
                    pasteData.split('').forEach((char, i) => {
                        if (inputs[i]) inputs[i].value = char;
                    });
                    const focusIdx = Math.min(pasteData.length, inputs.length - 1);
                    inputs[focusIdx].focus();
                }
            });
        });

        function showMessage(text, isSuccess = false) {
            statusMsg.style.display = 'block';
            statusMsg.style.background = isSuccess ? '#f0fdf4' : '#fef2f2';
            statusMsg.style.color = isSuccess ? '#166534' : '#991b1b';
            statusMsg.style.border = isSuccess ? '1px solid #bbf7d0' : '1px solid #fecaca';
            statusMsg.textContent = text;
        }

        function handleOtpSubmit(e) {
            e.preventDefault();
            let code = '';
            inputs.forEach(i => code += i.value);
            if (code.length !== 6) {
                showMessage('Please enter all 6 digits of the verification code.');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<span>Verifying...</span>';

            setTimeout(() => {
                showMessage('✓ Verification successful! Access granted.', true);
                verifyBtn.innerHTML = '<span>Verified ✓</span>';
                setTimeout(() => {
                    alert('Verification complete! In your project, this will redirect to your dashboard.');
                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = '<span>Verify & Continue &rarr;</span>';
                }, 800);
            }, 600);
        }

        function handleResend() {
            resendBtn.disabled = true;
            let sec = 30;
            resendBtn.innerText = `Resend in ${sec}s`;
            showMessage('A fresh verification code has been dispatched.', true);

            const timer = setInterval(() => {
                sec--;
                resendBtn.innerText = `Resend in ${sec}s`;
                if (sec <= 0) {
                    clearInterval(timer);
                    resendBtn.disabled = false;
                    resendBtn.innerText = 'Resend code';
                }
            }, 1000);
        }
    </script>
</body>
</html>
